[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nh3pred"
version = "0.2.1"
description = "Predict ammonia emissions with a recurrent neural network model"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12.3"
authors = [
  { name = "Armand Favrot", email = "armand.favrot@inrae.fr" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python",
]
dependencies = [
  "pandas>=3.0.0",
  "torch>=2.5.0",
  "numpy>=1.26"
]

[project.optional-dependencies]
build = ["build", "twine"]
dev = ["pytest"]
docs = ["sphinx", "sphinx-rtd-theme", "matplotlib", "seaborn", "ipykernel", "nbformat", "nbclient", "pyyaml"]

[project.urls]
Documentation = "https://nh3pred.readthedocs.io/en/latest/"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nh3pred = ["data/*.pth", "data/*.pkl", "data/*.json"]

[tool.bumpver]
current_version = "0.2.1"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message = "bump version {old_version} -> {new_version}"
tag_message = "{new_version}"
commit = true
tag = true
push = false

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
    'version = "{version}"',
]

"docs/source/conf.py" = [
    'release = "{version}"',
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["nh3pred"]

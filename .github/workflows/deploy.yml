name: Publish and test on TestPyPI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nh3pred-testpypi
  cancel-in-progress: false

jobs:
  tests:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/test.yml

  testpypi:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build and validate distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Publish only to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
      - name: Download the published wheel from TestPyPI
        shell: bash
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          for attempt in 1 2 3 4 5 6; do
            if python -m pip download --no-deps --no-cache-dir --only-binary=:all: \
              --index-url https://test.pypi.org/simple/ \
              --dest downloaded "nh3pred==$version"; then
              break
            fi
            if [ "$attempt" = 6 ]; then exit 1; fi
            sleep 10
          done
          python - <<'PY'
          from pathlib import Path
          import hashlib
          wheels = list(Path("downloaded").glob("*.whl"))
          assert len(wheels) == 1, "Expected exactly one downloaded wheel"
          wheel = wheels[0]
          assert wheel.read_bytes() == (Path("dist") / wheel.name).read_bytes(), \
              "TestPyPI already contains a different wheel: use a new version"
          print("Verified TestPyPI wheel SHA256:", hashlib.sha256(wheel.read_bytes()).hexdigest())
          PY
      - name: Test the published wheel in a fresh environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/testpypi-venv"
          "$RUNNER_TEMP/testpypi-venv/bin/python" -m pip install \
            --index-url https://pypi.org/simple/ downloaded/*.whl pytest
          "$RUNNER_TEMP/testpypi-venv/bin/python" -m pip check
          "$RUNNER_TEMP/testpypi-venv/bin/python" -m pytest tests -q
      - name: Keep the validated distributions for a separate PyPI decision
        uses: actions/upload-artifact@v4
        with:
          name: testpypi-validated-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30
      - name: Record the release candidate
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          {
            echo "## TestPyPI validation succeeded"
            echo "Source commit: $SOURCE_SHA"
            echo "Run ID for a later, manual PyPI publication: $GITHUB_RUN_ID"
            echo "Distributions are retained for 30 days. Nothing was sent to PyPI."
            sha256sum dist/*
          } >> "$GITHUB_STEP_SUMMARY"

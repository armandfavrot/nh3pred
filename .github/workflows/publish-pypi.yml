name: Publish validated distributions to PyPI (manual)

on:
  workflow_dispatch:
    inputs:
      testpypi_run_id:
        description: "Successful TestPyPI workflow run ID (not a job ID)"
        required: true
        type: string
      version:
        description: "Exact version to publish, e.g. 0.2.0"
        required: true
        type: string
      confirm:
        description: "I have reviewed TestPyPI and authorize publication on real PyPI"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: nh3pred-pypi
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && inputs.confirm
    runs-on: ubuntu-latest
    # Configure required reviewers in GitHub Settings for an additional gate.
    environment: pypi
    steps:
      - name: Verify the selected TestPyPI run
        uses: actions/github-script@v7
        env:
          TESTPYPI_RUN_ID: ${{ inputs.testpypi_run_id }}
        with:
          script: |
            const runId = process.env.TESTPYPI_RUN_ID;
            if (!/^[1-9][0-9]*$/.test(runId)) {
              throw new Error("Expected a numeric workflow run ID");
            }
            const {data: run} = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: runId
            });
            if (run.path !== ".github/workflows/deploy.yml" ||
                run.event !== "workflow_dispatch" ||
                run.head_branch !== "main" ||
                run.head_repository?.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                run.status !== "completed" || run.conclusion !== "success") {
              throw new Error("Expected a successful manual TestPyPI run from this repository's main branch");
            }
            await core.summary.addHeading("Promoting validated distributions")
              .addRaw(`Source commit: ${run.head_sha}\n\nTestPyPI run: ${run.html_url}`)
              .write();
      - name: Download exactly the validated archives (no rebuild)
        uses: actions/download-artifact@v4
        with:
          name: testpypi-validated-distributions
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ inputs.testpypi_run_id }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify the requested version and archives
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python -m pip install twine
          python - <<'PY'
          import email
          import os
          from pathlib import Path
          import zipfile
          version = os.environ["RELEASE_VERSION"]
          expected = {f"nh3pred-{version}-py3-none-any.whl", f"nh3pred-{version}.tar.gz"}
          assert {p.name for p in Path("dist").iterdir()} == expected, \
              "Archives do not match the requested release version"
          with zipfile.ZipFile(Path("dist") / f"nh3pred-{version}-py3-none-any.whl") as wheel:
              metadata = [n for n in wheel.namelist() if n.endswith(".dist-info/METADATA")]
              assert len(metadata) == 1
              info = email.message_from_bytes(wheel.read(metadata[0]))
              assert info["Name"] == "nh3pred" and info["Version"] == version
          PY
          python -m twine check dist/*
          sha256sum dist/*
      - name: Publish to real PyPI only after explicit manual confirmation
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.TRUE_PYPI_API_TOKEN }}
